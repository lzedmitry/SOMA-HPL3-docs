name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure GitHub Pages URLs
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == "${OWNER}.github.io" ]]; then
            BASE_PATH="/"
          else
            BASE_PATH="/${REPO}/"
          fi
          {
            echo "SITE_URL=https://${OWNER}.github.io"
            echo "BASE_PATH=${BASE_PATH}"
            echo "GITHUB_REPO_URL=https://github.com/${GITHUB_REPOSITORY}"
            echo "EDIT_BASE_URL=https://github.com/${GITHUB_REPOSITORY}/edit/main/"
          } >> "$GITHUB_ENV"
      - name: Build
        run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
