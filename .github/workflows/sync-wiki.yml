name: Wiki sync

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and transform
        run: python3 scripts/wiki/fetch_wiki.py && python3 scripts/wiki/transform.py
      - name: Open review PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: sync Frictional Wiki sources"
          title: "Wiki sync (review required)"
          body: |
            Automated import from wiki.frictionalgames.com.
            Do not merge without reading reports/content-status.md.
            This workflow does not publish to GitHub Pages by itself.
          branch: chore/wiki-sync
          labels: wiki-sync
